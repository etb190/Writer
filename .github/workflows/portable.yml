name: Portable build

# Builds the Windows single self-contained executable of the Writer Avalonia desktop
# app (PublishSingleFile: the .NET runtime and native libraries are embedded in one
# binary; natives unpack themselves to a temp dir on first launch). Every run publishes
# the executable directly on the Releases page — manual runs roll the "latest"
# pre-release in place; a `writer-v*` tag makes a versioned release. The asset downloads
# raw from the release: no zip wrapper, no Actions artifacts, no other platforms.

on:
  workflow_dispatch:
  push:
    tags:
      - 'writer-v*'

permissions:
  contents: write

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    name: win-x64
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${GITHUB_REF_NAME#writer-v}"
          else
            v="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"

      - name: Publish single-file win-x64
        run: |
          dotnet publish Writer.App.Avalonia/Writer.App.Avalonia.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            -o out
          mv out/Writer.exe Writer-win-x64.exe
          ls -lh Writer-win-x64.exe

      - name: Pick release target
        id: rel
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "title=Writer ${GITHUB_REF_NAME#writer-v}" >> "${GITHUB_OUTPUT}"
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            echo "latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=latest" >> "${GITHUB_OUTPUT}"
            echo "title=Latest build" >> "${GITHUB_OUTPUT}"
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
            echo "latest=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.title }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          make_latest: ${{ steps.rel.outputs.latest }}
          overwrite_files: true
          files: Writer-win-x64.exe
          generate_release_notes: ${{ github.ref_type == 'tag' }}
