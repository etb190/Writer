name: Portable build

# Builds a single self-contained executable of the Writer Avalonia desktop app
# per platform (PublishSingleFile: the .NET runtime and native libraries are
# embedded in one binary; natives unpack themselves to a temp dir on first
# launch). Every run publishes the executables directly on the Releases page —
# manual runs roll the "latest" pre-release in place; a `writer-v*` tag makes
# a versioned release. Release assets download raw (no zip wrapper).
#
# RIDs mirror Writer.App.Avalonia.csproj RuntimeIdentifiers.

on:
  workflow_dispatch:
  push:
    tags:
      - 'writer-v*'

permissions:
  contents: write

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    name: ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${GITHUB_REF_NAME#writer-v}"
          else
            v="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"

      - name: Publish single-file ${{ matrix.rid }}
        run: |
          dotnet publish Writer.App.Avalonia/Writer.App.Avalonia.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            -o out

      - name: Stage executable
        run: |
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then
            src=out/Writer.exe
            ext=.exe
          else
            src=out/Writer
            ext=
            chmod +x "${src}"
          fi
          # Stable asset names so the rolling "latest" release replaces in place.
          cp "${src}" "Writer-${{ matrix.rid }}${ext}"
          ls -lh Writer-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Writer-${{ matrix.rid }}
          path: Writer-*
          if-no-files-found: error

  release:
    name: Publish executables
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - name: Pick release target
        id: rel
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "title=Writer ${GITHUB_REF_NAME#writer-v}" >> "${GITHUB_OUTPUT}"
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            echo "latest=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=latest" >> "${GITHUB_OUTPUT}"
            echo "title=Latest build" >> "${GITHUB_OUTPUT}"
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
            echo "latest=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.title }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          make_latest: ${{ steps.rel.outputs.latest }}
          overwrite_files: true
          files: release/Writer-*
          generate_release_notes: ${{ github.ref_type == 'tag' }}
